[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.36"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
ignored_warnings_from = ["lib/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true
